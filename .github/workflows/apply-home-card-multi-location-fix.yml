name: Apply Home Card Multi Location Fix

on:
  push:
    branches:
      - fix/home-card-multi-location
    paths:
      - '.github/workflows/apply-home-card-multi-location-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/home-card-multi-location
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded patch
        run: node scripts/apply-home-card-multi-location-fix.mjs

      - name: Run full test suite
        run: npm test

      - name: Commit fixed production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/client/app/app-enhancements.js src/client/app/item-workflow-enhancements.js src/client/app/home-location-display.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "fix: render all home card locations without country suffix"
          git push origin HEAD:fix/home-card-multi-location
