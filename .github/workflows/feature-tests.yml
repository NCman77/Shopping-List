name: Feature tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install E2E dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: find . -path './.git' -prune -o -name '*.test.mjs' -print0 | xargs -0 node --test
      - name: Syntax checks
        run: |
          find src/client -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check auth-session.js
      - name: Integration markers
        run: |
          APP_FILE="src/client/app/app-enhancements.js"
          DRIVE_FILE="src/client/photos/drive-photo-service.js"
          DRIVE_AUTH_FILE="src/client/auth/google-drive-signin.js"
          grep -q "item-website" "$APP_FILE"
          grep -q "觀看介紹" "$APP_FILE"
          grep -q "configureGoogleProviderForDrive" "$APP_FILE"
          grep -q "drive.appdata" "$DRIVE_AUTH_FILE"
          grep -q "itemPhotos" "$APP_FILE"
          grep -q "appDataFolder" "$DRIVE_FILE"
      - name: Firestore schema guard
        run: |
          grep -q 'match /artifacts/{appId}/users/{userId}' firebase/firestore.rules
          grep -q 'japan-shopping-app' src/client/app/app-enhancements.js
          grep -q 'japan-shopping-app' src/client/photos/photo-visibility-enhancements.js
          ! grep -q 'match /users/{userId}/' firebase/firestore.rules
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E smoke test
        run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore rules integration test
        run: npm run test:rules
